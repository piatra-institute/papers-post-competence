- id: selfeval-kadavath
  kind: source
  passage: Earlier studies found that larger models evaluate the correctness of their own sampled answers with useful calibration on many tasks [@kadavath2022], that without external feedback they struggle to correct their own reasoning and sometimes make it worse [@huang2023], that self-critique fails on reasoning and planning tasks where a sound external verifier helps [@stechly2024], and that model evaluators recognise and favour their own generations [@panickssery2024].
  evidence:
    citation_id: kadavath2022
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Abstract read: larger models are well calibrated on multiple-choice and true/false questions; self-evaluation P(True) of proposed answers shows encouraging performance and calibration. Huang et al. (abstract): LLMs struggle to self-correct reasoning without external feedback and performance can degrade. Stechly et al. (abstract): GPT-4 self-critique shows performance collapse on Game of 24, graph colouring and STRIPS planning, with gains from sound external verification. Panickssery et al. (abstract): LLM evaluators recognise and favour their own generations.'
    quote: We find encouraging performance, calibration, and scaling for P(True) on a diverse array of tasks.
