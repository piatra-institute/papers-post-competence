- id: def-onetask
  kind: definition
  passage: Fix one task.
  rationale: Section 3 analyses a single task; populations of tasks are treated in Section 4.2.
- id: prop1-once
  kind: interpretation
  passage: The odds form shows that the invoker's evidence is applied once.
  rationale: 'Reading of the odds form of Proposition 1: each accepted output has passed exactly one check.'
- id: prop1-onecheck
  kind: interpretation
  passage: Every accepted output has passed one check, and no amount of resampling raises its odds above the generator's odds multiplied by the check's likelihood ratio.
  rationale: Follows from the protocol definition (accept the first output that passes a single check) and Proposition 1.
- id: vote-onewrong
  kind: interpretation
  passage: 'The vote therefore replaces the invoker''s verification competence with an assumption about how errors are spread: one systematic wrong answer that is more frequent than the right one defeats it (Figure 1a).'
  rationale: 'Plurality limit for independent attempts: a single wrong answer more probable than the right one wins in the limit (checked in tests/test_theory.py and Figure 1a).'
- id: prop3-pool-def
  kind: definition
  passage: '**Proposition 3.** (a) Let $P_{\text{pool}}=\mathbb E[a_x\pi_x]/\mathbb E[a_x]$ be the pooled precision, the share of correct outputs among accepted ones when each task is attempted once.'
  rationale: 'Definition of pooled precision in Proposition 3(a): one attempt per task.'
- id: def-compute
  kind: definition
  passage: Under a model check each attempt costs one generation and one verdict call, and a verdict on a candidate already judged can be reused.
  rationale: 'Unit of compute: one generation per attempt plus one verdict call per newly judged candidate under a model check (Section 3).'
- id: assume-iid
  kind: assumption
  passage: Given the task, attempts are independent and identically distributed, which holds exactly for independent samples from a fixed model and prompt.
  rationale: Exact for independent samples from a fixed model and prompt (fresh sessions in the measurement); all propositions condition on it. Dependence across tasks is treated in Proposition 3.
- id: assume-verdicts
  kind: assumption
  passage: Given the attempts, verdicts are independent, with sensitivity $s=\Pr(V=1\mid\text{correct})$ and false-acceptance rate $f=\Pr(V=1\mid\text{incorrect})$.
  rationale: Conditional independence of verdicts across attempts; Proposition 4 treats repeated verdicts on the same candidate.
- id: src-green
  kind: interpretation
  passage: In the vocabulary of signal detection, $s$ is a hit rate and $f$ a false-alarm rate [@green1966].
  rationale: 'Attribution only: Green and Swets (1966), identity checked via OpenLibrary, not re-read; the sentence uses only the standard hit-rate and false-alarm-rate vocabulary.'
- id: prop1
  kind: interpretation
  passage: '*Proof.* Because attempts are independent and identically distributed, the first accepted attempt is correct with probability $sp/a=\pi$ whatever its position, and some attempt among the first $n$ is accepted with probability $1-(1-a)^n$.'
  rationale: Proposition 1 proved in the text; checked numerically against simulation and exact enumeration in simulation/tests/test_theory.py (recorded run 'tests').
