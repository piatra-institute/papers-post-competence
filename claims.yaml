  kind: definition
  passage: '![Theory. (a) Reliability against attempts for one task with $p=0.4$: oracle check, a check with $s=0.9$ and $f=0.15$ (dotted line at its ceiling), plurality vote when the right answer is the most probable one and when a wrong answer is, and accepting the first output. (b) The ceiling as a function of the check''s likelihood ratio for $p\in\{0.1,0.3,0.5,0.7\}$; grey lines mark targets. (c) The population ceiling for tasks with Beta-distributed success probabilities of mean 0.6, a common check, and varying intraclass correlation, with the bounds of Proposition 3 and its second-order approximation. (d) Attempts needed for a target reliability with the check of panel (a) and with an oracle check.](figures/theory.pdf){width=100%}'
  rationale: Figure 1 is drawn by the recorded run from the closed forms (example parameters fixed in run_all.py; Beta population with mean 0.6).
