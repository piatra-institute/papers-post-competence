- id: intro-thesis
  kind: interpretation
  passage: The claim that externalised intelligence makes everyone such a ruler, so that what a person can bring about depends on the computation they command more than on the skills they possess, can be summarised as "power equals compute".
  rationale: States the thesis under test in neutral form; the paper tests a narrow, checkable version of it and does not advocate it.
- id: intro-anderson
  kind: source
  passage: The term has been used in educational linguistics for a different idea, an orientation of language education beyond the competence model [@anderson2023].
  evidence:
    citation_id: anderson2023
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Crossref record and abstract read: the article proposes looking beyond Bernstein''s ''competence model'' in educational linguistics. Only the prior use of the term is claimed.'
- id: intro-ceiling-def
  kind: definition
  passage: Accepting the first output that passes the check converges, as attempts grow, to $sp/[sp + f(1-p)]$, the check's precision at the generator's base rate; call it the precision ceiling.
  rationale: Names the limit of Proposition 1; the formula is proved in Section 4.1.
- id: intro-davis
  kind: source
  passage: Davis and colleagues derive it for a "verifier-based judge" and show that resampling gains over one attempt exactly when the check accepts correct outputs more often than incorrect ones [@davis2024].
  evidence:
    citation_id: davis2024
    locator: Section 2.2, Theorems 1 and 2
    depth: fulltext
    verified: false
    verification_note: 'Read the arXiv v1 PDF, Section 2.2. Theorem 1 gives P(J(q)=a*) = rc(1-(1-beta)^K)/beta + (1-beta)^K/|A|; Theorem 2: gain positive iff r not in {0,1} and c > 1 - s.'
    quote: 'When the number of generators K goes to infinity, the gain of a verifier-based judge is positive if and only if: r ≠ 0, 1 and c = P(J(a, π) = 1 | a = a∗) > P(J(a, π) = 1 | a ≠ a∗) = 1 − s.'
- id: intro-stroebl
  kind: source
  passage: Stroebl, Kapoor and Narayanan show that unit-test verifiers with false positives cap the accuracy of resampling on code benchmarks, so that a weaker model cannot reach a stronger model's single-attempt accuracy this way [@stroebl2024].
  evidence:
    citation_id: stroebl2024
    locator: abstract and Section 3
    depth: fulltext
    verified: false
    verification_note: 'Read v3 (26 March 2026) abstract and Section 3: imperfect verifiers with non-zero false-positive probability impose an upper bound on resampling accuracy; weaker models cannot match a sufficiently strong model''s single-sample accuracy (HumanEval+ and MBPP+).'
    quote: Then the weaker model cannot match the performance of a single invocation of the stronger model, no matter how big the compute budget for the weaker model.
- id: intro-brown
  kind: source
  passage: Related work measures how the share of problems solved by some sample grows with the number of samples [@brown2024; @schaeffer2025], how majority voting can degrade as calls are added [@chen2024calls], and how to allocate test-time compute across prompts [@snell2024].
  evidence:
    citation_id: brown2024
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Abstract read: coverage scales with samples over four orders of magnitude; majority voting and reward models plateau beyond several hundred samples. Schaeffer et al. (abstract) relate aggregate scaling to the distribution of per-problem success; Chen et al. 2024 (abstract) report non-monotone vote scaling; Snell et al. (abstract) study compute-optimal allocation.'
- id: intro-cobbe
  kind: source
  passage: Verifiers trained to rank sampled solutions go back at least to work on grade-school mathematics [@cobbe2021; @lightman2023].
  evidence:
    citation_id: cobbe2021
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Abstract read: GSM8K; train verifiers to judge completions; at test time generate many candidates and select the highest-ranked. Lightman et al. (abstract): process supervision on MATH.'
- id: intro-contrib
  kind: interpretation
  passage: Beyond these results, the paper does the following.
  rationale: Statement of contribution relative to Davis et al. (2024) and Stroebl et al. (2024); each item is proved in Section 4 or measured in Section 5.
- id: def-attainable
  kind: definition
  passage: The attainable set at budget $c$ and reliability $\rho$ is $$\mathcal A_i(c,\rho)=\{x\in\mathcal X:\ \exists\,\pi\in\Pi_i,\ C(\pi)\le c,\ p_x(\pi)\ge\rho\}.$$ It plays the role of Sen's capability set, the set of functionings a person is able to achieve [@sen1985], restricted to outcomes with stated standards, budgets and reliability.
  rationale: Definition used throughout; compute threshold c*_x(rho) follows.
- id: def-sen
  kind: interpretation
  passage: The attainable set at budget $c$ and reliability $\rho$ is $$\mathcal A_i(c,\rho)=\{x\in\mathcal X:\ \exists\,\pi\in\Pi_i,\ C(\pi)\le c,\ p_x(\pi)\ge\rho\}.$$ It plays the role of Sen's capability set, the set of functionings a person is able to achieve [@sen1985], restricted to outcomes with stated standards, budgets and reliability.
  rationale: Attribution of the analogy to the capability set (Sen 1985, identity checked via OpenLibrary; not re-read). No specific claim from the book is used.
- id: def-sufficiency
  kind: definition
  passage: '*Novice sufficiency* means that a person without the relevant training reaches the standard $\rho$ on $x$ with assistance, so that $x$ enters their attainable set.'
  rationale: Distinguishes the two empirical claims; novice sufficiency is membership in the attainable set at reliability rho.
- id: src-noy
  kind: source
  passage: The evidence on improvement is substantial. In a preregistered experiment with 453 college-educated professionals, access to ChatGPT cut the time spent on writing tasks by 40% and raised assessed quality by 18%, and inequality between workers decreased [@noy2023].
  evidence:
    citation_id: noy2023
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Crossref abstract read: 453 college-educated professionals; time decreased by 40% and output quality rose by 18%; inequality between workers decreased.'
    quote: The average time taken decreased by 40% and output quality rose by 18%. Inequality between workers decreased
- id: src-brynjolfsson
  kind: source
  passage: Among 5,172 customer-support agents, a conversational assistant raised issues resolved per hour by 15% on average, with less experienced and lower-skilled workers improving in both speed and quality [@brynjolfsson2025].
  evidence:
    citation_id: brynjolfsson2025
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Crossref abstract of the published QJE article read: 5,172 agents; productivity up 15% on average; less experienced and lower-skilled workers improve both speed and quality.'
    quote: Access to AI assistance increases worker productivity, as measured by issues resolved per hour, by 15% on average
- id: src-becker-main
  kind: source
  passage: In a randomised trial in which 16 experienced open-source developers completed 246 tasks, allowing AI tools increased completion time by 19%, although the developers had forecast a 24% reduction and estimated a 20% reduction afterwards [@becker2025].
  evidence:
    citation_id: becker2025
    locator: abstract
    depth: fulltext
    verified: false
    verification_note: 'Read v2 full text: abstract states 16 developers, 246 tasks, forecast 24% reduction, post-hoc estimate 20% reduction, observed 19% increase in completion time.'
    quote: Surprisingly, we find that allowing AI actually increases completion time by 19%—AI tooling slowed developers down.
- id: src-becker-review
  kind: source
  passage: They accepted under 44% of AI generations and spent about 9% of their AI-assisted time reviewing and cleaning AI output [@becker2025, app. C.1.4].
  evidence:
    citation_id: becker2025
    locator: Appendix C.1.4
    depth: fulltext
    verified: false
    verification_note: 'Read Appendix C.1.4 (Low AI reliability): developers accept <44% of generations; on 44 issues with labelled screen recordings about 9% of time with AI is spent reviewing and cleaning AI outputs.'
    quote: developers spend approximately 9% of their time reviewing and cleaning AI generated outputs when working with AI.
- id: src-dellacqua
  kind: source
  passage: In a field experiment with 758 consultants, AI access improved work on tasks inside the frontier of the system's capability but made consultants less likely to reach a correct answer on a task selected to lie outside it [@dellacqua2023].
  evidence:
    citation_id: dellacqua2023
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'Crossref abstract of the SSRN working paper read: 758 knowledge workers; inside the frontier AI users completed more tasks faster with higher quality; on a task selected to be outside the frontier, AI users were less likely to produce correct solutions. The effect size is not reported in the paper because its unit is ambiguous in the abstract.'
    quote: for a complex managerial task selected to be outside the frontier, subjects using AI were 19% less likely to produce correct solutions compared with those without AI
- id: interp-two-studies
  kind: interpretation
  passage: The first study shows verification consuming expert time; the second shows assisted people accepting wrong output.
  rationale: Interpretive summary of the two preceding source claims.
- id: src-kwa
  kind: source
  passage: 'Measured capability also depends on the reliability demanded: for frontier agents on software tasks, the task length completed with 80% success is 4 to 6 times shorter than the length completed with 50% success [@kwa2025, sec. 3.2.1].'
  evidence:
    citation_id: kwa2025
    locator: Section 3.2.1
    depth: fulltext
    verified: false
    verification_note: 'Read v4 Section 3.2.1: 80% time horizons are 4-6x shorter than 50% horizons; doubling times similar.'
    quote: However, models’ 80% time horizons are 4-6x shorter, suggesting that even models that sometimes succeed on difficult and diverse tasks cannot reliably perform tasks of moderate length.
- id: assume-iid
  kind: assumption
  passage: Given the task, attempts are independent and identically distributed, which holds exactly for independent samples from a fixed model and prompt.
  rationale: Exact for independent samples from a fixed model and prompt (fresh sessions in the measurement); all propositions condition on it. Dependence across tasks is treated in Proposition 3.
- id: assume-verdicts
  kind: assumption
  passage: Given the attempts, verdicts are independent, with sensitivity $s=\Pr(V=1\mid\text{correct})$ and false-acceptance rate $f=\Pr(V=1\mid\text{incorrect})$.
  rationale: Conditional independence of verdicts across attempts; Proposition 4 treats repeated verdicts on the same candidate.
- id: src-green
  kind: interpretation
  passage: In the vocabulary of signal detection, $s$ is a hit rate and $f$ a false-alarm rate [@green1966].
  rationale: 'Attribution only: Green and Swets (1966), identity checked via OpenLibrary, not re-read; the sentence uses only the standard hit-rate and false-alarm-rate vocabulary.'
- id: prop1
  kind: interpretation
  passage: '*Proof.* Because attempts are independent and identically distributed, the first accepted attempt is correct with probability $sp/a=\pi$ whatever its position, and some attempt among the first $n$ is accepted with probability $1-(1-a)^n$.'
  rationale: Proposition 1 proved in the text; checked numerically against simulation and exact enumeration in simulation/tests/test_theory.py (recorded run 'tests').
- id: prop1-davis
  kind: source
  passage: Davis and colleagues obtain the same limit for a judge that returns a random answer when every candidate is rejected [@davis2024, thm. 1–2].
  evidence:
    citation_id: davis2024
    locator: Section 2.2, Theorems 1 and 2
    depth: fulltext
    verified: false
    verification_note: Read Theorems 1-2 and proofs. Their judge returns a random answer when all candidates are rejected; the K-to-infinity limit rc/beta equals the ceiling.
- id: prop1-meehl
  kind: source
  passage: 'Its dependence on the base rate is the point Meehl and Rosen made about psychometric signs [@meehl1955]: a check that separates well can still pass many errors when correct outputs are rare.'
  evidence:
    citation_id: meehl1955
    locator: abstract
    depth: abstract
    verified: false
    verification_note: 'OpenAlex abstract read: a psychometric device must yield more correct decisions than base rates alone; efficiency depends on base rates.'
- id: prop2
  kind: interpretation
  passage: '*Proof.* Rearrange $(\pi-p)(1-a)^{n-1}\le\pi-\rho$, dividing by $\ln(1-a)<0$.'
  rationale: Proposition 2 proved in the text; n* checked for minimality in tests/test_theory.py.
