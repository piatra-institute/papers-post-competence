- id: interp-threshold
  kind: interpretation
  passage: 'Proposition 2 is the compute threshold of Section 2 for a single strategy: the task enters the attainable set at finite cost only if the check is good enough, and otherwise extra compute moves reliability towards the ceiling but never to the target.'
  rationale: Connects Proposition 2 to the definition of c*_x(rho).
- id: vote-condorcet
  kind: interpretation
  passage: By Condorcet's jury theorem and its generalisation to plurality choice among several options, the vote of independent attempts converges to the correct answer when it is the most probable answer, and to a wrong answer when some wrong answer is more probable [@condorcet1785; @list2001].
  rationale: 'Attribution of classical results: Condorcet (1785) and List and Goodin (2001) were identity-checked but not re-read. The binary theorem is as stated in Boland''s (1989) abstract; the plurality limit for independent attempts is a standard law-of-large-numbers consequence and is checked numerically in tests/test_theory.py.'
- id: vote-ladha
  kind: source
  passage: Correlation among voters weakens the classical guarantee [@boland1989; @ladha1992], and when tasks differ in difficulty, vote accuracy can fall as calls are added [@chen2024calls]; self-consistency decoding applies the same vote to sampled reasoning paths [@wang2022].
  evidence:
    citation_id: ladha1992
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'OpenAlex abstract/opening read: the jury theorem assumes independent votes; the article relaxes this for correlated votes. Chen et al. 2024 abstract: non-monotone vote scaling from mixed query difficulty; Wang et al. abstract: self-consistency. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected full OpenAlex/DataCite abstracts for ladha1992 (10.2307/2111584, generalizes Condorcet Jury Theorem to correlated votes), chen2024calls (non-monotone vote scaling under varying query difficulty), and wang2022 (10.48550/arXiv.2203.11171, self-consistency decoding via sampled reasoning paths and majority vote), plus partial OpenAlex abstract for boland1989 (10.2307/2348873).'
- id: vote-redundancy
  kind: interpretation
