- id: selfeval-kadavath
  kind: source
  passage: Earlier studies found that larger models evaluate the correctness of their own sampled answers with useful calibration on many tasks [@kadavath2022], that without external feedback they struggle to correct their own reasoning and sometimes make it worse [@huang2023], that self-critique fails on reasoning and planning tasks where a sound external verifier helps [@stechly2024], and that model evaluators recognise and favour their own generations [@panickssery2024].
  evidence:
    citation_id: kadavath2022
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: larger models are well calibrated on multiple-choice and true/false questions; self-evaluation P(True) of proposed answers shows encouraging performance and calibration. Huang et al. (abstract): LLMs struggle to self-correct reasoning without external feedback and performance can degrade. Stechly et al. (abstract): GPT-4 self-critique shows performance collapse on Game of 24, graph colouring and STRIPS planning, with gains from sound external verification. Panickssery et al. (abstract): LLM evaluators recognise and favour their own generations. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstract for kadavath2022 (10.48550/arXiv.2207.05221) plus abstract-level checks for co-mentioned huang2023, stechly2024, panickssery2024; confirms larger models show encouraging P(True) self-evaluation calibration on diverse tasks.'
    quote: We find encouraging performance, calibration, and scaling for P(True) on a diverse array of tasks.
- id: selfeval-huang
  kind: source
  passage: Earlier studies found that larger models evaluate the correctness of their own sampled answers with useful calibration on many tasks [@kadavath2022], that without external feedback they struggle to correct their own reasoning and sometimes make it worse [@huang2023], that self-critique fails on reasoning and planning tasks where a sound external verifier helps [@stechly2024], and that model evaluators recognise and favour their own generations [@panickssery2024].
  evidence:
    citation_id: huang2023
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: LLMs struggle to self-correct their responses without external feedback, and at times performance degrades after self-correction. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstract for huang2023 (10.48550/arXiv.2310.01798); confirms LLMs struggle to self-correct reasoning without external feedback and sometimes degrade.'
    quote: our research indicates that LLMs struggle to self-correct their responses without external feedback, and at times, their performance even degrades after self-correction.
- id: selfeval-stechly
  kind: source
  passage: Earlier studies found that larger models evaluate the correctness of their own sampled answers with useful calibration on many tasks [@kadavath2022], that without external feedback they struggle to correct their own reasoning and sometimes make it worse [@huang2023], that self-critique fails on reasoning and planning tasks where a sound external verifier helps [@stechly2024], and that model evaluators recognise and favour their own generations [@panickssery2024].
  evidence:
    citation_id: stechly2024
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: significant performance collapse with self-critique and significant gains with sound external verification, in Game of 24, Graph Coloring and STRIPS planning. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstract for stechly2024 (10.48550/arXiv.2402.08115); confirms self-critique collapses on reasoning/planning tasks while sound external verification improves performance.'
    quote: We observe significant performance collapse with self-critique and significant performance gains with sound external verification.
- id: selfeval-panickssery
  kind: source
  passage: Earlier studies found that larger models evaluate the correctness of their own sampled answers with useful calibration on many tasks [@kadavath2022], that without external feedback they struggle to correct their own reasoning and sometimes make it worse [@huang2023], that self-critique fails on reasoning and planning tasks where a sound external verifier helps [@stechly2024], and that model evaluators recognise and favour their own generations [@panickssery2024].
  evidence:
