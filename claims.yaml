- id: intro-thesis
  kind: interpretation
  passage: The claim that externalised intelligence makes everyone such a ruler, so that what a person can bring about depends on the computation they command more than on the skills they possess, can be summarised as "power equals compute".
  rationale: States the thesis under test in neutral form; the paper tests a narrow, checkable version of it and does not advocate it.
- id: intro-anderson
  kind: source
  passage: The term has been used in educational linguistics for a different idea, an orientation of language education beyond the competence model [@anderson2023].
  evidence:
    citation_id: anderson2023
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Crossref record and abstract read: the article proposes looking beyond Bernstein''s ''competence model'' in educational linguistics. Only the prior use of the term is claimed. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected Crossref/OpenAlex abstract of Anderson (2023), Educational Linguistics 3(2):258-285 (DOI 10.1515/eduling-2023-0009); proposes a ''post-competence perspective'' moving beyond Bernstein''s ''competence model'' in educational linguistics.'
- id: intro-ceiling-def
  kind: definition
  passage: Accepting the first output that passes the check converges, as attempts grow, to $sp/[sp + f(1-p)]$, the check's precision at the generator's base rate; call it the precision ceiling.
  rationale: Names the limit of Proposition 1; the formula is proved in Section 4.1.
- id: intro-davis
  kind: source
  passage: Davis and colleagues derive it for a "verifier-based judge" and show that resampling gains over one attempt exactly when the check accepts correct outputs more often than incorrect ones [@davis2024].
  evidence:
    citation_id: davis2024
    locator: Section 2.2, Theorems 1 and 2
    depth: fulltext
    verified: true
    verification_note: 'Read the arXiv v1 PDF, Section 2.2. Theorem 1 gives P(J(q)=a*) = rc(1-(1-beta)^K)/beta + (1-beta)^K/|A|; Theorem 2: gain positive iff r not in {0,1} and c > 1 - s. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, fulltext): Inspected DataCite record (10.48550/arXiv.2407.16831) and v1 PDF Section 2.2 (Theorems 1 and 2); derives limit rc/beta = sp/[sp+f(1-p)] and positive gain iff r not in {0,1} and c > 1-s.'
    quote: 'When the number of generators K goes to infinity, the gain of a verifier-based judge is positive if and only if: r ≠ 0, 1 and c = P(J(a, π) = 1 | a = a∗) > P(J(a, π) = 1 | a ≠ a∗) = 1 − s.'
- id: intro-stroebl
  kind: source
  passage: Stroebl, Kapoor and Narayanan show that unit-test verifiers with false positives cap the accuracy of resampling on code benchmarks, so that a weaker model cannot reach a stronger model's single-attempt accuracy this way [@stroebl2024].
  evidence:
    citation_id: stroebl2024
    locator: abstract and Section 3
    depth: fulltext
    verified: true
    verification_note: 'Read v3 (26 March 2026) abstract and Section 3: imperfect verifiers with non-zero false-positive probability impose an upper bound on resampling accuracy; weaker models cannot match a sufficiently strong model''s single-sample accuracy (HumanEval+ and MBPP+). Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, fulltext): Inspected DataCite abstract (10.48550/arXiv.2411.17501) and v3 PDF introduction/Appendix C; shows false positives in imperfect unit-test verifiers on HumanEval and MBPP cap resampling below a sufficiently strong model''s single-sample accuracy.'
    quote: Then the weaker model cannot match the performance of a single invocation of the stronger model, no matter how big the compute budget for the weaker model.
- id: intro-brown
  kind: source
  passage: Related work measures how the share of problems solved by some sample grows with the number of samples [@brown2024; @schaeffer2025], how majority voting can degrade as calls are added [@chen2024calls], and how to allocate test-time compute across prompts [@snell2024].
  evidence:
    citation_id: brown2024
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: coverage scales with samples over four orders of magnitude; majority voting and reward models plateau beyond several hundred samples. Schaeffer et al. (abstract) relate aggregate scaling to the distribution of per-problem success; Chen et al. 2024 (abstract) report non-monotone vote scaling; Snell et al. (abstract) study compute-optimal allocation. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstracts for all four co-cited works: brown2024 (10.48550/arXiv.2407.21787, log-linear sample coverage scaling), schaeffer2025 (10.48550/arXiv.2502.17578), chen2024calls (10.48550/arXiv.2403.02419, non-monotone Vote scaling), and snell2024 (10.48550/arXiv.2408.03314, adaptive test-time allocation across prompts).'
- id: intro-cobbe
  kind: source
  passage: Verifiers trained to rank sampled solutions go back at least to work on grade-school mathematics [@cobbe2021; @lightman2023].
  evidence:
    citation_id: cobbe2021
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: GSM8K; train verifiers to judge completions; at test time generate many candidates and select the highest-ranked. Lightman et al. (abstract): process supervision on MATH. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstracts for cobbe2021 (10.48550/arXiv.2110.14168, GSM8K trained verifiers ranking sampled solutions) and lightman2023 (10.48550/arXiv.2305.20050, MATH supervision).'
- id: intro-contrib
  kind: interpretation
  passage: Beyond these results, the paper does the following.
  rationale: Statement of contribution relative to Davis et al. (2024) and Stroebl et al. (2024); each item is proved in Section 4 or measured in Section 5.
- id: ov-bowman
  kind: source
  passage: People assisted by an unreliable dialogue model outperformed both the model and their own unaided performance on two question-answering tasks [@bowman2022].
  evidence:
    citation_id: bowman2022
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: human participants interacting with an unreliable LLM dialog assistant substantially outperform both the model alone and their own unaided performance on MMLU and time-limited QuALITY. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstract for bowman2022 (10.48550/arXiv.2211.03540); humans assisted by an unreliable LLM dialogue model outperform both the model and unaided humans on MMLU and time-limited QuALITY.'
    quote: we find that human participants who interact with an unreliable large-language-model dialog assistant through chat -- a trivial baseline strategy for scalable oversight -- substantially outperform both the model alone and their own unaided performance.
- id: ov-saunders
  kind: source
  passage: Model-written critiques helped people find flaws they would otherwise have missed [@saunders2022].
  evidence:
    citation_id: saunders2022
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: critiques written by fine-tuned models help humans find flaws in summaries that they would have otherwise missed. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstract for saunders2022 (10.48550/arXiv.2206.05802); model-written critiques help humans find flaws in summaries they would otherwise miss.'
    quote: critiques written by our models help humans find flaws in summaries that they would have otherwise missed.
- id: ov-burns
  kind: source
  passage: Strong models fine-tuned on a weak model's labels outperformed their supervisor without recovering their full capability [@burns2023].
  evidence:
    citation_id: burns2023
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read: strong pretrained models fine-tuned on weak-model labels consistently perform better than their weak supervisors but do not recover their full capabilities with naive fine-tuning. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected DataCite abstract and OpenAlex record for burns2023 (10.48550/arXiv.2312.09390); strong models fine-tuned on weak labels beat their supervisor without recovering full capabilities under naive finetuning.'
    quote: they consistently perform better than their weak supervisors, a phenomenon we call weak-to-strong generalization. However, we are still far from recovering the full capabilities of strong models with naive finetuning alone
- id: ov-contrast
  kind: interpretation
  passage: These studies ask whether weak supervision can be made better; this paper asks how far a given weak check lets compute go.
  rationale: Positions the paper relative to the scalable-oversight literature.
- id: def-attainable
  kind: definition
  passage: The attainable set at budget $c$ and reliability $\rho$ is $$\mathcal A_i(c,\rho)=\{x\in\mathcal X:\ \exists\,\pi\in\Pi_i,\ C(\pi)\le c,\ p_x(\pi)\ge\rho\}.$$ It plays the role of Sen's capability set, the set of functionings a person is able to achieve [@sen1985], restricted to outcomes with stated standards, budgets and reliability.
  rationale: Definition used throughout; compute threshold c*_x(rho) follows.
- id: def-sen
  kind: interpretation
  passage: The attainable set at budget $c$ and reliability $\rho$ is $$\mathcal A_i(c,\rho)=\{x\in\mathcal X:\ \exists\,\pi\in\Pi_i,\ C(\pi)\le c,\ p_x(\pi)\ge\rho\}.$$ It plays the role of Sen's capability set, the set of functionings a person is able to achieve [@sen1985], restricted to outcomes with stated standards, budgets and reliability.
  rationale: Attribution of the analogy to the capability set (Sen 1985, identity checked via OpenLibrary; not re-read). No specific claim from the book is used.
- id: def-sufficiency
  kind: definition
  passage: '*Novice sufficiency* means that a person without the relevant training reaches the standard $\rho$ on $x$ with assistance, so that $x$ enters their attainable set.'
  rationale: Distinguishes the two empirical claims; novice sufficiency is membership in the attainable set at reliability rho.
- id: src-noy
  kind: source
  passage: The evidence on improvement is substantial. In a preregistered experiment with 453 college-educated professionals, access to ChatGPT cut the time spent on writing tasks by 40% and raised assessed quality by 18%, and inequality between workers decreased [@noy2023].
  evidence:
    citation_id: noy2023
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Crossref abstract read: 453 college-educated professionals; time decreased by 40% and output quality rose by 18%; inequality between workers decreased. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected OpenAlex abstract for noy2023 (10.1126/science.adh2586); preregistered study of 453 college-educated professionals reporting 40% time decrease, 18% quality rise, and lower inequality.'
    quote: The average time taken decreased by 40% and output quality rose by 18%. Inequality between workers decreased
- id: src-brynjolfsson
  kind: source
  passage: Among 5,172 customer-support agents, a conversational assistant raised issues resolved per hour by 15% on average, with less experienced and lower-skilled workers improving in both speed and quality [@brynjolfsson2025].
  evidence:
    citation_id: brynjolfsson2025
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Crossref abstract of the published QJE article read: 5,172 agents; productivity up 15% on average; less experienced and lower-skilled workers improve both speed and quality. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected Crossref and OpenAlex abstracts for brynjolfsson2025 (10.1093/qje/qjae044); 5,172 customer-support agents, 15% average increase in issues resolved per hour, largest speed and quality gains for less experienced/lower-skilled workers.'
    quote: Access to AI assistance increases worker productivity, as measured by issues resolved per hour, by 15% on average
- id: src-becker-main
  kind: source
  passage: In a randomised trial in which 16 experienced open-source developers completed 246 tasks, allowing AI tools increased completion time by 19%, although the developers had forecast a 24% reduction and estimated a 20% reduction afterwards [@becker2025].
  evidence:
    citation_id: becker2025
    locator: abstract
    depth: fulltext
    verified: true
    verification_note: 'Read v2 full text: abstract states 16 developers, 246 tasks, forecast 24% reduction, post-hoc estimate 20% reduction, observed 19% increase in completion time. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, fulltext): Inspected DataCite abstract and v2 PDF for becker2025 (10.48550/arXiv.2507.09089); RCT with 16 developers and 246 tasks, 24% forecast reduction, 20% post-hoc perceived reduction, 19% observed slowdown.'
    quote: Surprisingly, we find that allowing AI actually increases completion time by 19%—AI tooling slowed developers down.
- id: src-becker-review
  kind: source
  passage: They accepted under 44% of AI generations and spent about 9% of their AI-assisted time reviewing and cleaning AI output [@becker2025, app. C.1.4].
  evidence:
    citation_id: becker2025
    locator: Appendix C.1.4
    depth: fulltext
    verified: true
    verification_note: 'Read Appendix C.1.4 (Low AI reliability): developers accept <44% of generations; on 44 issues with labelled screen recordings about 9% of time with AI is spent reviewing and cleaning AI outputs. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, fulltext): Inspected becker2025 v2 PDF Appendix C.1.4; confirms <44% acceptance of AI generations and approximately 9% of AI-assisted time spent reviewing and cleaning AI outputs on labelled screen recordings.'
    quote: developers spend approximately 9% of their time reviewing and cleaning AI generated outputs when working with AI.
- id: src-dellacqua
  kind: source
  passage: In a field experiment with 758 consultants, AI access improved work on tasks inside the frontier of the system's capability but made consultants less likely to reach a correct answer on a task selected to lie outside it [@dellacqua2026].
  evidence:
    citation_id: dellacqua2026
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Crossref abstract of the version of record (Organization Science 37(2), 2026) read; it matches the SSRN working-paper abstract: 758 knowledge workers; inside the frontier AI users completed more tasks faster with higher quality; on a task selected to be outside the frontier, AI users were less likely to produce correct solutions. The effect size is not reported in the paper because its unit is ambiguous in the abstract. Independent check (gemini-4-hydrogen-xhigh, 2026-11-21, abstract): Inspected Crossref and OpenAlex abstracts for dellacqua2026 (Organization Science 37(2):403-423, DOI 10.1287/orsc.2025.21838); 758 knowledge workers, improved outcomes inside the frontier and 19% lower likelihood of correct solutions outside it.'
    quote: for a complex managerial task selected to be outside the frontier, subjects using AI were 19% less likely to produce correct solutions compared with those without AI
- id: interp-two-studies
  kind: interpretation
  passage: The first study shows verification consuming expert time; the second shows assisted people accepting wrong output.
  rationale: Interpretive summary of the two preceding source claims.
