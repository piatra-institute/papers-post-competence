[project]
name = "post-competence-sim"
version = "1.0.0"
description = "Reliability bought by repeated sampling under imperfect acceptance checks: theory checks and analysis of frozen model outputs on Omni-MATH (HMMT February items)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
